name: myhouse

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Bound to 127.0.0.1 so only the host's cloudflared service can reach it.
      # In the Cloudflare dashboard, point maison.gregoirevaillant.fr to http://localhost:8083 (see ~/apps/README.md)
      - "127.0.0.1:8083:1000"
    volumes:
      - data:/data
    # durcissement : pas de nouveaux privilèges, seulement les droits nécessaires pour confier /data à l'utilisateur node
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
